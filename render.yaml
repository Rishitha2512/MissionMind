services:
  - type: web
    name: missionmind
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYSIS_SERVICE_URL
        value: https://missionmind-analysis-k0i7.onrender.com
  - type: web
    name: missionmind-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r analysis-service/requirements.txt
    startCommand: cd analysis-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
